# ── ClinicalTrials.gov ───────────────────────────────────────────────────────
#ctgov_query: '"Long COVID" OR "Post-COVID-19 Condition" OR PASC OR "post-acute sequelae of SARS-CoV-2"'
ctgov_query: '"Long COVID" OR "Post-COVID-19 Condition" OR PASC OR "post-acute sequelae of SARS-CoV-2" OR "Myalgic Encephalomyelitis" OR "Chronic Fatigue Syndrome" OR "ME/CFS" OR "Post-Viral Fatigue Syndrome" OR "Post-Treatment Lyme Disease Syndrome" OR "Postural Orthostatic Tachycardia Syndrome"'

# Status → priority tier (5 = highest evidence value)
ctgov_status_priority:
  COMPLETED: 5
  ACTIVE_NOT_RECRUITING: 4
  RECRUITING: 3
  ENROLLING_BY_INVITATION: 3
  NOT_YET_RECRUITING: 2
  SUSPENDED: 2
  TERMINATED: 2
  WITHDRAWN: 1
  UNKNOWN: 1

# ── Pipeline config ──────────────────────────────────────────────────────────
config:
  max_pubmed: 50000
  max_europepmc: 2000
  max_semantic_scholar: 0
  max_openalex: 2000
  request_delay: 0.35
  start_year: 2020
  end_year: 2026
  ncbi_email: "neginbabaiha@gmail.com"   # override via env var NCBI_EMAIL
