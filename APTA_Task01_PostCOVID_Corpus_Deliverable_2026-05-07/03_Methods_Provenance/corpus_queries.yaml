# corpus_queries.yaml
# =============================================================================
# Externalized queries and filter terms for the unified Post-COVID corpus
# builder. Edit this file to refine searches between iterations — no code
# changes needed (per APTA Task 1 subtask 3: "2nd iteration: search refinement").
# =============================================================================

# ── Topic terms (one of these MUST appear in title/abstract) ─────────────────
# ── Disease scope (grouped — used by both corpus builder and dashboard) ───────
# The corpus builder flattens all groups into one postcovid_terms list.
# The dashboard reads the grouped structure to plot disease scope coverage.
disease_scope:
  "Post-COVID / Long COVID":
    - "long covid"
    - "post-covid"
    - "post covid"
    - "pasc"
    - "post-acute sequelae"
    - "long-haul covid"
    - "long haul covid"
    - "post-acute covid"
    - "covid-19 sequelae"
    - "chronic covid"
    - "ongoing covid"
    - "post-covid-19 condition"
    - "post-covid syndrome"

  "ME/CFS":
    - "myalgic encephalomyelitis"
    - "chronic fatigue syndrome"
    - "me/cfs"
    - "me-cfs"
    - "systemic exertion intolerance disease"
    - "seid"
    - "fatigue syndrome, chronic"

  "Post-viral / post-infectious (other)":
    - "post-viral fatigue"
    - "postviral fatigue"
    - "post-viral syndrome"
    - "post-infectious fatigue"
    - "postinfectious fatigue"
    - "post-infectious syndrome"
    - "post-acute infection syndrome"
    - "post-acute infectious syndrome"
    - "pais"
    - "post-sars syndrome"
    - "post-ebola syndrome"
    - "post-q fever"
    - "post-treatment lyme"
    - "ptlds"
    - "post-mononucleosis fatigue"

  "POTS / dysautonomia":
    - "postural orthostatic tachycardia syndrome"
    - "pots"
    - "dysautonomia"

# ── Intervention/trial terms (one of these MUST also appear) ─────────────────
