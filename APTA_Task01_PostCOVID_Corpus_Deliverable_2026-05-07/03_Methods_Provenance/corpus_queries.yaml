# ── Discard terms (used as soft signal in study-type filter) ─────────────────
discard_terms:
  - "systematic review"
  - "meta-analysis"
  - "narrative review"
  - "scoping review"
  - "umbrella review"
  - "editorial"
  - "letter to the editor"
  - "commentary"
  - "case report"
  - "case series"
  - "study protocol"
    # ADD — observational study types (closes the OpenAlex/EPMC gap)
  - "cohort study"
  - "observational study"
  - "cross-sectional study"
  - "prospective cohort"
  - "retrospective cohort"
  - "registry study"
  - "population-based study"

# ── PubMed queries ───────────────────────────────────────────────────────────
pubmed_queries:
  - label: "PubMed_RCT_Core"
    query: >
      ("long COVID"[tiab] OR "post-COVID"[tiab] OR "post COVID"[tiab] OR
       "PASC"[tiab] OR "post-acute sequelae"[tiab] OR "long-haul COVID"[tiab] OR
       "post-acute COVID"[tiab] OR "post-COVID-19 condition"[tiab])
      AND
      ("randomized controlled trial"[pt] OR "randomised controlled trial"[tiab]
       OR "RCT"[tiab] OR "clinical trial"[pt])

  - label: "PubMed_Pharmacological"
    query: >
      ("long COVID"[tiab] OR "post-COVID"[tiab] OR "PASC"[tiab] OR
       "post-acute sequelae"[tiab])
      AND
      ("pharmacological"[tiab] OR "drug therapy"[tiab] OR "treatment"[tiab] OR
       "intervention"[tiab])
      AND
      ("clinical trial"[pt] OR "randomized"[tiab] OR "placebo"[tiab])

  - label: "PubMed_DrugClasses"
    query: >
      ("long COVID"[tiab] OR "post-COVID"[tiab] OR "PASC"[tiab])
      AND
      ("anticoagulant"[tiab] OR "antiviral"[tiab] OR "immunomodulator"[tiab] OR
       "low-dose naltrexone"[tiab] OR "metformin"[tiab] OR "BC007"[tiab] OR
       "Paxlovid"[tiab] OR "nirmatrelvir"[tiab] OR "SSRIs"[tiab] OR
       "vortioxetine"[tiab] OR "corticosteroid"[tiab] OR "colchicine"[tiab] OR
       "ivermectin"[tiab] OR "vitamin D"[tiab] OR "melatonin"[tiab])

  - label: "PubMed_MeSH"
    query: >
      ("COVID-19"[MeSH] OR "SARS-CoV-2"[MeSH])
      AND "post-acute sequelae"[tiab]
      AND ("Randomized Controlled Trial"[pt] OR "Clinical Trial"[pt])

  # ADD (Post-COVID + related post-viral / ME-CFS)
  - label: "PubMed_MECFS_RCT"
    query: >
      ("myalgic encephalomyelitis"[tiab] OR "chronic fatigue syndrome"[tiab] OR
       "ME/CFS"[tiab] OR "systemic exertion intolerance disease"[tiab] OR
       "post-viral fatigue"[tiab] OR "post-viral syndrome"[tiab])
      AND
      ("randomized controlled trial"[pt] OR "clinical trial"[pt] OR
       "randomised controlled trial"[tiab] OR "RCT"[tiab] OR "placebo"[tiab])

  - label: "PubMed_PostInfectious"
    query: >
      ("post-infectious fatigue"[tiab] OR "post-acute infection syndrome"[tiab] OR
       "post-treatment Lyme"[tiab] OR "post-SARS"[tiab] OR
       "post-Ebola"[tiab] OR "post-Q fever"[tiab])
      AND
      ("randomized"[tiab] OR "clinical trial"[pt] OR "treatment"[tiab])

  - label: "PubMed_POTS_Dysautonomia"
    query: >
      ("POTS"[tiab] OR "postural orthostatic tachycardia"[tiab] OR
       "dysautonomia"[tiab])
      AND ("long COVID"[tiab] OR "PASC"[tiab] OR "ME/CFS"[tiab] OR
           "myalgic encephalomyelitis"[tiab])
      AND ("randomized"[tiab] OR "clinical trial"[pt] OR "trial"[tiab])

  # ADD
  - label: "PubMed_DigitalBiomarkers"
    query: >
      ("long COVID"[tiab] OR "post-COVID"[tiab] OR "PASC"[tiab] OR
       "ME/CFS"[tiab] OR "myalgic encephalomyelitis"[tiab] OR
       "chronic fatigue syndrome"[tiab])
      AND
      ("wearable"[tiab] OR "actigraphy"[tiab] OR "digital biomarker"[tiab] OR
       "digital endpoint"[tiab] OR "mHealth"[tiab] OR "smartphone"[tiab] OR
       "mobile app"[tiab] OR "remote monitoring"[tiab] OR
       "heart rate variability"[tiab])

  - label: "PubMed_SpeechVoice"
    query: >
      ("long COVID"[tiab] OR "post-COVID"[tiab] OR "PASC"[tiab] OR
       "ME/CFS"[tiab] OR "myalgic encephalomyelitis"[tiab] OR
       "chronic fatigue syndrome"[tiab])
      AND
      ("speech biomarker"[tiab] OR "vocal biomarker"[tiab] OR
       "voice analysis"[tiab] OR "speech analysis"[tiab] OR
       "acoustic analysis"[tiab])

  - label: "PubMed_FunctionalOutcomes"
    query: >
      ("long COVID"[tiab] OR "post-COVID"[tiab] OR "PASC"[tiab] OR
       "ME/CFS"[tiab] OR "post-viral fatigue"[tiab])
      AND
      ("6-minute walk"[tiab] OR "cardiopulmonary exercise testing"[tiab] OR
       "CPET"[tiab] OR "post-exertional malaise"[tiab] OR
       "patient-reported outcome"[tiab])
      AND
      ("randomized"[tiab] OR "clinical trial"[pt] OR "trial"[tiab])
  
  - label: "PubMed_Autoantibody"
    query: >
      ("long COVID"[tiab] OR "post-COVID"[tiab] OR "PASC"[tiab] OR
      "ME/CFS"[tiab] OR "myalgic encephalomyelitis"[tiab])
      AND
      ("rituximab"[tiab] OR "IVIG"[tiab] OR "intravenous immunoglobulin"[tiab] OR
      "plasma exchange"[tiab] OR "plasmapheresis"[tiab] OR
      "GPCR autoantibody"[tiab] OR "beta-2 adrenergic"[tiab] OR
      "BC007"[tiab])

  - label: "PubMed_MeSH_Drugs"
    query: >
      ("Post-Acute COVID-19 Syndrome"[MeSH] OR "Fatigue Syndrome, Chronic"[MeSH])
      AND ("Randomized Controlled Trial"[pt] OR "Clinical Trial"[pt])
      AND ("Antiviral Agents"[MeSH] OR "Immunologic Factors"[MeSH] OR
          "Anticoagulants"[MeSH] OR "Adrenergic Uptake Inhibitors"[MeSH])
# ── Europe PMC queries ───────────────────────────────────────────────────────

europepmc_queries:
  - 'TITLE_ABS:"long COVID" AND TITLE_ABS:("randomised controlled trial" OR "randomized controlled trial" OR "RCT") AND PUB_YEAR:[2020 TO 2026]'
  - 'TITLE_ABS:"post-COVID" AND TITLE_ABS:(pharmacological OR treatment OR intervention) AND PUB_YEAR:[2020 TO 2026]'
  - 'TITLE_ABS:"PASC" AND TITLE_ABS:(trial OR placebo OR randomized OR randomised) AND PUB_YEAR:[2020 TO 2026]'
  - 'TITLE_ABS:"post-acute sequelae" AND TITLE_ABS:("clinical trial" OR "randomized" OR "drug") AND PUB_YEAR:[2020 TO 2026]'
  - 'TITLE_ABS:"long-haul COVID" AND TITLE_ABS:(treatment OR therapy OR pharmacological) AND PUB_YEAR:[2020 TO 2026]'
  # ADDED MORE CFS terms
  - 'TITLE_ABS:("myalgic encephalomyelitis" OR "chronic fatigue syndrome" OR "ME/CFS") AND TITLE_ABS:("randomized controlled trial" OR "RCT" OR "placebo") AND PUB_YEAR:[2015 TO 2026]'
  - 'TITLE_ABS:("post-viral fatigue" OR "post-viral syndrome" OR "post-infectious fatigue") AND TITLE_ABS:(trial OR treatment OR randomised OR randomized) AND PUB_YEAR:[2015 TO 2026]'
  - 'TITLE_ABS:("postural orthostatic tachycardia" OR "dysautonomia") AND TITLE_ABS:("long COVID" OR "ME/CFS") AND PUB_YEAR:[2020 TO 2026]'

  # ADD more CFS terms
  - 'TITLE_ABS:("long COVID" OR "post-COVID" OR "PASC" OR "ME/CFS" OR "myalgic encephalomyelitis") AND TITLE_ABS:(wearable OR actigraphy OR "digital biomarker" OR mHealth OR "mobile app" OR "heart rate variability") AND PUB_YEAR:[2018 TO 2026]'
  - 'TITLE_ABS:("long COVID" OR "post-COVID" OR "ME/CFS") AND TITLE_ABS:("speech biomarker" OR "vocal biomarker" OR "voice analysis" OR "acoustic analysis") AND PUB_YEAR:[2018 TO 2026]'
  - 'TITLE_ABS:("long COVID" OR "post-COVID" OR "PASC" OR "ME/CFS") AND TITLE_ABS:("6-minute walk" OR "cardiopulmonary exercise" OR "post-exertional malaise" OR "patient-reported outcome") AND PUB_YEAR:[2018 TO 2026]'

  # ADD auto anti bodies
  - 'TITLE_ABS:("long COVID" OR "post-COVID" OR "PASC" OR "ME/CFS" OR "myalgic encephalomyelitis") AND TITLE_ABS:(rituximab OR IVIG OR "intravenous immunoglobulin" OR "plasma exchange" OR plasmapheresis OR "BC007" OR "beta-2 adrenergic") AND PUB_YEAR:[2015 TO 2026]'

  # Preprints via Europe PMC (medRxiv + bioRxiv)
  - 'TITLE_ABS:("long COVID" OR "post-COVID" OR "PASC") AND TITLE_ABS:(randomized OR placebo OR trial) AND SRC:PPR AND PUB_YEAR:[2020 TO 2026]'
  - 'TITLE_ABS:("myalgic encephalomyelitis" OR "chronic fatigue syndrome" OR "ME/CFS") AND TITLE_ABS:(randomized OR placebo OR trial) AND SRC:PPR AND PUB_YEAR:[2020 TO 2026]'
  - 'TITLE_ABS:("long COVID" OR "post-COVID" OR "PASC" OR "ME/CFS") AND TITLE_ABS:(wearable OR "digital biomarker" OR "speech biomarker") AND SRC:PPR AND PUB_YEAR:[2020 TO 2026]'

